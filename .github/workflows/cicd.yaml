name: CI/CD Pipeline

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch: # Allow manual triggering

env:
  NX_BASE: origin/master

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Audit
        run: npm audit || true

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Outdated
        run: npm outdated || true

      - name: Lint
        run: npm run affected:lint -- --base=origin/master

      - name: Test
        run: npm run affected:test -- --base=origin/master

      - name: Build
        run: npm run affected:build -- --base=origin/master

      - name: Build Libraries
        run: |
          npx nx build angular-shared
          npx nx build angular-auth-shared

      - name: Variables
        id: variables
        run: |
          echo "project_name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "project_version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

  release:
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@olddude"

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Extract Version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build Affected Libraries
        run: npx nx affected --target=build --base=origin/master --parallel=1

      - name: Update Package Versions and Publish
        run: |
          VERSION=${{ steps.version.outputs.version }}
          for lib in $(npx nx show projects --type=lib --affected --base=origin/master); do
            if [ -f "dist/libs/$lib/package.json" ]; then
              echo "Publishing $lib..."
              npm version $VERSION --no-git-tag-version --prefix "dist/libs/$lib"
              npm publish --access public --prefix "dist/libs/$lib"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Git Tag
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          git tag -a ${{ steps.variables.outputs.project_version }} -m "Release ${{ steps.release_variables.outputs.project_version }}" || true
          git push origin ${{ steps.variables.outputs.project_version }} || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.variables.outputs.project_version }}
          tag_name: ${{ steps.variables.outputs.project_version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
