name: CI/CD Pipeline

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch: # Allow manual triggering

env:
  NX_BASE: origin/master

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Audit
        run: npm audit || true

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Outdated
        run: npm outdated || true

      - name: Lint
        run: npm run affected:lint -- --base=origin/master

      - name: Test
        run: npm run affected:test -- --base=origin/master

      - name: Build
        run: npm run affected:build -- --base=origin/master

      - name: Build Libraries
        run: |
          npx nx build angular-shared
          npx nx build angular-auth-shared

  release:
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@olddude"

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Set release variables
        id: release_variables
        run: |
          project_name=$(node -p "require('./package.json').name")
          project_version=$(node -p "require('./package.json').version")
          build_number=${{ github.run_number }}
          echo "project_name=$project_name" >> $GITHUB_OUTPUT
          echo "project_version=$project_version" >> $GITHUB_OUTPUT
          echo "build_number=$build_number" >> $GITHUB_OUTPUT

      - name: Build Affected Libraries
        run: npx nx affected --target=build --base=origin/master --parallel=1

      - name: Update Package Versions and Publish
        run: |
          VERSION=${{ steps.release_variables.outputs.project_version }}
          BUILD_NUMBER=${{ steps.release_variables.outputs.build_number }}
          FULL_VERSION="$VERSION.$BUILD_NUMBER"
          
          for lib in $(npx nx show projects --type=lib --affected --base=origin/master); do
            if [ -f "dist/libs/$lib/package.json" ]; then
              echo "Publishing $lib with version $FULL_VERSION..."
              npm version $FULL_VERSION --no-git-tag-version --prefix "dist/libs/$lib"
              npm publish --access public --prefix "dist/libs/$lib"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Variables
        id: variables
        run: |
          echo "project_name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "project_version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          FULL_VERSION="${{ steps.release_variables.outputs.project_version }}.${{ steps.release_variables.outputs.build_number }}"
          git tag -a $FULL_VERSION -m "Release $FULL_VERSION" || true
          git push origin $FULL_VERSION || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.release_variables.outputs.project_version }}.${{ steps.release_variables.outputs.build_number }}
          tag_name: ${{ steps.release_variables.outputs.project_version }}.${{ steps.release_variables.outputs.build_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
