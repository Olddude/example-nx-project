name: CI/CD Pipeline

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

env:
  NX_BASE: origin/master

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Security Audit
        run: npm audit || true

      - name: Install Dependencies
        run: npm ci

      - name: Check Outdated Packages
        run: npm outdated || true

      - name: Lint Affected
        run: npx nx affected --target=lint --base=${{ env.NX_BASE }}

      - name: Test Affected
        run: npx nx affected --target=test --base=${{ env.NX_BASE }}

      - name: Build Affected
        run: npx nx affected --target=build --base=${{ env.NX_BASE }}

  release:
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@olddude"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Extract Version Info
        id: version
        run: |
          PROJECT_NAME=$(node -p "require('./package.json').name")
          PROJECT_VERSION=$(node -p "require('./package.json').version")
          echo "name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "version=$PROJECT_VERSION" >> $GITHUB_OUTPUT

      - name: Build Affected Libraries
        run: npx nx affected --target=build --base=${{ env.NX_BASE }} --parallel=1

      - name: Publish Affected Libraries
        run: npx nx affected --target=publish --base=${{ env.NX_BASE }} --parallel=1 -- --version=${{ steps.version.outputs.version }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Git Tag
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          git tag -a ${{ steps.version.outputs.version }} -m "Release ${{ steps.version.outputs.version }}" || true
          git push origin ${{ steps.version.outputs.version }} || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
